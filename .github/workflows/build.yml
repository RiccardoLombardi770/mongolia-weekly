name: Build site

on:
  push:
    branches: [main]
    paths:
      - "reports/**"          # only rebuild when content or layout changes
      - "mentions/**"
      - "templates/**"
      - "assets/**"
      - "config.yaml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install jinja2 pyyaml openpyxl

      - name: Build the static site
        run: python scripts/build.py

      - name: Commit the rebuilt site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "Rebuild site [skip ci]"
          git push
