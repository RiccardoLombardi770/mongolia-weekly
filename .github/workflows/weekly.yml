name: Weekly report (draft PR)

on:
  schedule:
    # 00:00 UTC every Monday = 08:00 Ulaanbaatar (UTC+8, no DST).
    # Tip: GitHub's scheduler queues every repository worldwide using this
    # same round minute, and can occasionally drop a run during that spike.
    # If a Monday ever goes silent with no run at all, moving a few minutes
    # off the hour (e.g. "7 0 * * 1") is a cheap mitigation.
    - cron: "7 0 * * 1"
  workflow_dispatch: {}   # lets you also run it manually from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  build-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ---------- the weekly news report ----------
      - name: Collect news
        run: python scripts/collect.py

      - name: Generate report (draft + self-review loop + translation)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate.py

      # ---------- the "In the Media" page ----------
      # Each step is allowed to fail without taking the report down with it.
      - name: Update the index of our own publications
        continue-on-error: true
        run: python scripts/index_un.py

      - name: Collect media mentions
        continue-on-error: true
        run: python scripts/collect_mentions.py

      - name: Analyse mentions (tone, source matching, translation)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_mentions.py

      # ---------- open the review PR ----------
      - name: Write the pull request summary
        run: python scripts/pr_body.py

      - name: Open a review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Weekly draft: report + media mentions"
          branch: report/draft
          delete-branch: true
          title: "Mongolia Weekly — ready for review"
          body-path: data/pr_body.md
          add-paths: |
            reports/*.json
            mentions/*.json
            index/*.json
          # Optional, and separate from the notify.yml email below: set your
          # colleague's GitHub username so she is auto-requested as a GitHub
          # reviewer and gets GitHub's own notification too.
          # reviewers: her-github-username
