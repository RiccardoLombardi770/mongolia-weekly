name: Weekly report (publish + email)

on:
  schedule:
    # 00:00 UTC every Monday = 08:00 Ulaanbaatar (UTC+8, no DST).
    # Tip: GitHub's scheduler queues every repository worldwide using this
    # same round minute, and can occasionally drop a run during that spike.
    # If a Monday ever goes silent with no run at all, moving a few minutes
    # off the hour (e.g. "7 0 * * 1") is a cheap mitigation.
    - cron: "7 0 * * 1"
  workflow_dispatch: {}   # lets you also run it manually from the Actions tab

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ---------- the weekly news report ----------
      - name: Collect news
        run: python scripts/collect.py

      - name: Generate report (draft + self-review loop + translation)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate.py

      # ---------- the "In the Media" page ----------
      # Each step is allowed to fail without taking the report down with it.
      - name: Update the index of our own publications
        continue-on-error: true
        run: python scripts/index_un.py

      - name: Collect media mentions
        continue-on-error: true
        run: python scripts/collect_mentions.py

      - name: Analyse mentions (tone, source matching, translation)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_mentions.py

      # ---------- publish ----------
      # No review pull request: the week goes straight to main, the site is
      # rebuilt here, and the email goes out at the end of this same job.
      # Corrections are made afterwards by editing the JSON on main.
      - name: Commit this week's data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports mentions index
          # [skip ci] because this job rebuilds the site itself, two steps down;
          # without it build.yml would race this workflow over the same commit.
          git diff --staged --quiet || git commit -m "Weekly: report + media mentions [skip ci]"
          git push

      - name: Build the static site
        run: python scripts/build.py

      - name: Commit the rebuilt site
        run: |
          git add docs
          git diff --staged --quiet || git commit -m "Rebuild site"
          git push

      - name: Write the summary of what needs a human eye
        run: python scripts/pr_body.py

      - name: Prepare the email
        id: prep
        run: python scripts/notify.py

      # GitHub Pages publishes the pushed commit asynchronously; give it a
      # moment so the links in the email are live when they are clicked.
      - name: Wait for GitHub Pages to publish
        if: steps.prep.outputs.send == 'true'
        run: sleep 90

      - name: Send email
        if: steps.prep.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          # Sending via Gmail SMTP, since Authenticated SMTP is blocked on the
          # office's Microsoft 365 mailboxes and IT hasn't enabled it yet.
          # SMTP_USERNAME is the mailbox the email is sent FROM, and
          # SMTP_PASSWORD must be a Gmail App Password for that same mailbox,
          # not the normal account password. To change who it comes from,
          # change those two secrets — Gmail will not let us send as anyone
          # other than the authenticated account.
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.prep.outputs.subject }}
          to: ${{ steps.prep.outputs.recipients }}
          from: ${{ steps.prep.outputs.sender_name }} <${{ secrets.SMTP_USERNAME }}>
          reply_to: ${{ steps.prep.outputs.reply_to }}
          body: file://data/email_body.txt
