# ============================================================
#  Mongolia Weekly — central configuration
#  Most day-to-day changes (sources, outlets, names, glossary)
#  now live in sources/sources.xlsx, not here.
# ============================================================

site:
  title: "Mongolia Weekly"
  subtitle: "Media and news monitoring — UN Mongolia"
  media_page_title: "In the Media"
  base_url: "https://riccardolombardi770.github.io/mongolia-weekly"

# ---- Email sent to colleagues as soon as the week is published ----
notifications:
  enabled: true
  subject_prefix: "Mongolia Weekly"
  # The name shown as the sender. The ADDRESS is always the account the mail is
  # actually authenticated as — the SMTP_USERNAME repository secret — because
  # Gmail refuses to send as anyone else. To send from a different mailbox,
  # change the SMTP_USERNAME / SMTP_PASSWORD secrets to that account's address
  # and its own app password; nothing here needs to change.
  sender_name: "Mongolia Weekly — UN Mongolia"
  # Optional: replies go here instead of to the sending mailbox. Leave empty to
  # have replies go back to SMTP_USERNAME.
  reply_to: ""
  # Fixed list — edit directly here and commit. For a self-service list
  # instead, this could read a column from sources/sources.xlsx; ask if
  # you outgrow a handful of names.
  recipients:
    - "riccardo.lombardi@un.org"
    - "soyolmaa.dolgor@un.org"
    - "lim6@un.org"
    - "altangerel.choijoo@un.org"

lookback_days: 7

# ---- Model & self-review loop ----
model: "claude-sonnet-5"
# Translation is mechanical and glossary-constrained — a lighter, cheaper
# model handles it well. Comment out to use "model" for translation too.
translate_model: "claude-haiku-4-5-20251001"
max_output_tokens: 16000
# How many collected items get sent to the model to draft from. collect.py
# now sorts by relevance before this cut (see relevance_rank), so lowering
# this number trims the weakest items first, not a random slice. Lower this
# if weekly volume is consistently high (400+) and confidence stays low —
# fewer, better-chosen items are usually easier for the model to structure
# well than more, noisier ones.
max_items_to_model: 80
review:
  confidence_threshold: 90
  # Each extra pass costs a full draft-sized call. If confidence oscillates
  # instead of climbing (e.g. 58 -> 66 -> 61), a 3rd pass is not guaranteed
  # to help — 2 is a reasonable, cheaper default once the pipeline is stable.
  max_iterations: 2

# ---- The shared workbook (single source of truth for sources) ----
# The colleague edits this file in Excel and re-uploads it to GitHub.
# To move to a Google Sheet later, just set workbook_csv_urls below
# (File > Share > Publish to web > CSV, one URL per sheet).
workbook:
  path: "sources/sources.xlsx"
  csv_urls: {}      # e.g. sources: "https://docs.google.com/.../pub?gid=0&single=true&output=csv"

# ---- What counts as "about Mongolia" ----
mongolia_terms:
  - Mongolia
  - Mongolian
  - Ulaanbaatar
  - Ulan Bator
  - dzud
  - Gobi
  - Oyu Tolgoi
  - Erdenet
  - khural
  - tugrik

regional_terms:
  - "Mongolia China trade"
  - "Mongolia Russia"
  - "Mongolia coal exports"
  - "Mongolia mining"
  - "Mongolia border transit"
  - "Central Asia dzud"

# ---- Fallback sources, used only if the workbook is missing/empty ----
sources:
  google_news:
    enabled: true
    hl: "en-US"
    gl: "US"
    queries:
      - "Mongolia humanitarian"
      - "Mongolia economy"
      - "Mongolia politics government"
      - "Mongolia dzud winter herders"
      - "Mongolia mining coal exports"
      - "Mongolia China Russia"
      - "Ulaanbaatar"
  rss_feeds:
    - name: "UN News"
      url: "https://news.un.org/feed/subscribe/en/news/all/rss.xml"
  gdelt:
    enabled: true
    queries:
      - "Mongolia"
      - "Mongolia dzud"
    max_records: 40

# ---- UN agencies used for tagging + filter chips ----
agencies:
  - UNDP
  - UNICEF
  - WHO
  - WFP
  - IOM
  - UNFPA
  - FAO
  - UNESCO
  - ILO
  - UN Women
  - OHCHR
  - UNEP

# ---- The four categories (order = display order) ----
categories:
  - "Economy and Development"
  - "Politics, Governance and Diplomacy"
  - "Environment and Climate Change"
  - "Social and Humanitarian"

# Secondary tags a story can also carry (shown on the card, not a section)
secondary_tags:
  - "Mining"
  - "Trade"
  - "Health"
  - "Education"
  - "Gender"
  - "Migration"
  - "Air quality"
  - "Dzud"
  - "Regional relations"

# ---- UN Editorial Manual style ----
style:
  un_editorial: true
  # Deterministic linter fixes what can be fixed mechanically; the rest is
  # handled in the prompts. Set to false to disable the linter only.
  linter: true
  # These are never auto-changed; they are flagged in the pull request
  # so the office decides case by case.
  flag_only_terms:
    - Taiwan
    - Kosovo
    - Palestine
    - Palestinian
    - Western Sahara
    - Crimea
    - Nagorno-Karabakh
    - Abkhazia
    - South Ossetia

# ============================================================
#  MEDIA MONITORING ("In the Media" page)
# ============================================================
media_monitoring:
  enabled: true
  # How far back the index of our own publications reaches, in days.
  un_index_days: 180
  # Fetch the full article text (needed for tone + source matching).
  fetch_full_text: true
  fetch_timeout: 25
  # Raised from 60: the United Nations and Mongolia checks now run on the
  # article text rather than the headline, so more candidates reach the fetch
  # stage and are sorted out there. Each fetch costs about a second.
  max_articles_to_fetch: 110
  # Back-link matching: below this confidence the source is shown as
  # "not identified" rather than guessed.
  match_min_confidence: 60
  # Model adjudication of the top-N deterministic candidates.
  match_candidates: 3
  # How many articles are analysed (and translated) per model call. Keep this
  # low enough that one reply fits in max_output_tokens: roughly
  # max_output_tokens / 400 is a safe ceiling. Asking for all 60 at once is
  # what silently broke this page after its first week.
  classify_batch_size: 12
  tone_labels: ["Supportive", "Neutral", "Critical"]
  mention_types:
    - "Statement cited"
    - "Data or report cited"
    - "Event coverage"
    - "Direct criticism"
    - "Passing reference"
  prominence_levels: ["Headline", "Lead paragraph", "Body", "Passing"]
  # Drop candidates published on our own sites. Google News indexes undp.org and
  # un.org next to real outlets, and a press release of ours is not coverage of
  # us — without this they crowded out the genuine mentions almost entirely.
  # Set to false to go back to listing everything, our own pages included.
  exclude_own_publications: true
  # Require the article to concern Mongolia. Searching "UNDP Mongolia" also
  # returns pieces about UNDP elsewhere, which arrived as Mongolian media
  # mentions. An article naming someone on the roster is kept regardless.
  require_mongolia: true
  # Subjects that mention a United Nations body but are not coverage of our work
  # here. Heritage inscriptions dominated the page — 23 of 52 items in one week
  # were World Heritage, geopark and biosphere listings, down to a hotel review.
  # This is an editorial choice, not a technical one: delete a line to let that
  # subject back in. Matched against the headline and the search snippet, so a
  # story that merely happens to name a heritage site is not caught.
  exclude_topics:
    - world heritage
    - heritage site
    - heritage list
    - heritage committee
    - heritage nomination
    - intangible cultural heritage
    - unesco recognition
    - biosphere reserve
    - geopark
    - icomos
    - nowruz
    - novruz
    - memory of the world
  # UN domains: used both to recognise a citation of ours and, with the setting
  # above, to recognise a page as ours rather than a mention.
  un_domains:
    - mongolia.un.org
    - un.org
    - unicef.org
    - undp.org
    - who.int
    - wfp.org
    - iom.int
    - unfpa.org
    - fao.org
    - unesco.org
    - ilo.org
    - unwomen.org
    - ohchr.org
    - unep.org
    - reliefweb.int
    # Also ours in practice: national committees, UN University, Volunteers and
    # other UN-family sites whose pages are our own communications, not coverage.
    - unodc.org
    - unu.edu
    - unv.org
    - unicefusa.org
    - unfoundation.org
    - iaea.org
    - itu.int
    - undrr.org
    - unctad.org
    - un.int
    # Information centres and convention secretariats are also us: unric.org
    # published the Silk Road Caravan story that reached the page as coverage.
    - unric.org
    - unccd.int
    - unfccc.int
    - unis.unvienna.org
    - unmultimedia.org
