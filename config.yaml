# ============================================================
#  UN Mongolia Weekly — central configuration
#  Edit this file to change sources, agencies, themes, model.
#  You almost never need to touch the Python scripts.
# ============================================================

site:
  title: "UN Mongolia Weekly"
  subtitle: "Media Insights"
  # Public URL once GitHub Pages is on (used only for nice links / sharing):
  base_url: ""

# How many days back each weekly run looks:
lookback_days: 7

# ---- Model & self-review loop ----
model: "claude-sonnet-5"          # cheap + strong. Fallback: "claude-haiku-4-5-20251001"
max_output_tokens: 8000
review:
  confidence_threshold: 90        # stop the self-review loop at/above this score
  max_iterations: 3               # hard cap so it never loops forever

# ---- What counts as "about Mongolia" (domestic layer) ----
mongolia_terms:
  - Mongolia
  - Mongolian
  - Ulaanbaatar
  - Ulan Bator
  - dzud
  - Gobi
  - Oyu Tolgoi
  - Erdenet
  - khural       # parliament
  - tugrik       # currency

# ---- The "external but relevant to Mongolia" layer ----
regional_terms:
  - "Mongolia China trade"
  - "Mongolia Russia"
  - "Mongolia coal exports"
  - "Mongolia mining"
  - "Mongolia border transit"
  - "Central Asia dzud"

# ---- News sources (all free / public, no key needed) ----
sources:
  # Primary, reliable workhorse: Google News RSS (one feed per query).
  google_news:
    enabled: true
    hl: "en-US"
    gl: "US"
    queries:
      - "Mongolia humanitarian"
      - "Mongolia economy"
      - "Mongolia politics government"
      - "Mongolia dzud winter herders"
      - "Mongolia mining coal exports"
      - "Mongolia China Russia"
      - "Ulaanbaatar"
  # Extra RSS feeds (keyword-filtered for relevance).
  rss_feeds:
    - name: "UN News"
      url: "https://news.un.org/feed/subscribe/en/news/all/rss.xml"
    # ReliefWeb via its public RSS (no appname needed). Verify the exact URL
    # on reliefweb.int/country/mongolia before enabling:
    # - name: "ReliefWeb Mongolia"
    #   url: "https://reliefweb.int/country/mng/rss.xml"
  # Best-effort extra. GDELT rate-limits shared cloud IPs, so it often returns
  # nothing on GitHub — that's fine, the sources above carry the report.
  gdelt:
    enabled: true
    queries:
      - "Mongolia"
      - "Mongolia dzud"
    max_records: 40

# ---- UN agencies used for tagging + the filter chips ----
agencies:
  - UNDP
  - UNICEF
  - WHO
  - WFP
  - IOM
  - UNFPA
  - FAO
  - UNESCO
  - ILO
  - UN Women
  - OHCHR
  - UNEP

# ---- Thematic sections (order = display order) ----
themes:
  - "Humanitarian & Protection"
  - "Politics & Governance"
  - "Economy & Development"
  - "Climate & Environment"
  - "Health"
  - "Regional Dynamics"
